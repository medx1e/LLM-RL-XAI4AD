wayformer_hidden_dim: 128
sae_expansion_factor: 1
sae_l1_coeff: 0.01
sae_learning_rate: 0.003
sae_batch_size: 4096
sae_epochs: 100
top_k_activations: 50
steering_temperatures: [0.5, 1.0, 2.0, 5.0]
harvest_max_timesteps: 80
harvest_n_scenarios: 500
harvest_dt: 0.1
ttc_critical_threshold: 1.5
hard_braking_g_threshold: 0.4
# ---------------------------------------------------------------------------
# Hyperparameter tuning grid (used by sae_tuner.py)
#
# The Cartesian product of all lists below defines the full search space.
# ---------------------------------------------------------------------------
tune:
  # Sparsity penalty — primary knob for controlling L0
  l1_coeff:
    - 0.02    
    - 0.05   
    - 0.07   

  # Expansion factor — width of the sparse latent space
  expansion_factor:
    - 1      
    - 4
    - 16       

  # Training duration
  epochs:
    - 50

  # Learning rate
  learning_rate:
    - 3.0e-4
    - 1.0e-3
